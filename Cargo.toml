[package]
name = "studycue"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "A desktop application for managing weekly reading topics"

[dependencies]
eframe = "0.26"
egui = "0.26"
rusqlite = { version = "0.29", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
notify-rust = "4.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"